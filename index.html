<!doctype html>
<html lang="no">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI-verktøykassa</title>
  <link rel="stylesheet" href="./assets/css/styles.css">
</head>

<body>
  <!-- Top header (ikke sticky) -->
  <header id="site-header" class="site-header">
    <div class="container header-inner">
      <div class="brand">
        <span class="logo">🤖</span>
        <h1>AI-verktøykassa</h1>
      </div>
      <p class="tagline">Finn, filtrer og sammenlign AI-verktøy raskt.</p>
    </div>
  </header>

  <!-- Sticky filters (kategori-chips + toggles) -->
  <div id="filters" class="filters">
    <div class="container filters-inner">
      <div class="chips" id="categoryChips">
        <!-- Fylles av JS: “Alle”, “AI-stemmer”, “Bildegenerering”, … -->
      </div>
      <div class="toggles">
        <label class="toggle"><input type="checkbox" id="favOnly"> ⭐ Favoritter</label>
        <label class="toggle"><input type="checkbox" id="freeOnly"> 🔓 Gratis</label>
        <label class="toggle"><input type="checkbox" id="trialOnly"> 🧪 Gratis prøve</label>
      </div>
    </div>
  </div>

  <main id="main" class="main container">
    <!-- Resultat-lister bygges av JS, gruppert per kategori -->
    <div id="results"></div>
  </main>

  <footer class="footer">
    <div class="container">
      <small>Bygget for rask oversikt. ⭐ lagres lokalt. Del filtre via URL.</small>
    </div>
  </footer>

  <script src="./assets/js/app.js" defer></script>
</body>

</html>
